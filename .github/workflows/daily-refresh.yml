name: Daily dashboard refresh

on:
  schedule:
    # 22:13 UTC = 06:13 Perth time (AWST, UTC+8, no DST) -- early morning,
    # so the previous day's training is reflected before Olaf's day starts.
    # Off the hour/half-hour on purpose to avoid scheduler pile-ups.
    - cron: "13 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pinned to match the version used to generate the saved token
        # (vendored client, single-file garmin_tokens.json format).
        # Switched from 0.2.8 -> 0.3.2 on 2026-08-20 because 0.2.8's
        # garth-based login only had the classic JSON-API strategies,
        # which got persistently 429'd by Garmin's per-account rate
        # limit on the token-refresh endpoint. 0.3.2's login() tries
        # several strategies including an HTML-widget-based one that
        # got past the block -- see garmin_login_export_v2.py.
        run: pip install "garminconnect==0.3.2"

      - name: Write Garmin token
        env:
          GARMIN_TOKEN_JSON: ${{ secrets.GARMIN_TOKEN_JSON }}
        run: |
          mkdir -p garmin_tokens
          printf '%s' "$GARMIN_TOKEN_JSON" > garmin_tokens/garmin_tokens.json

      - name: Fetch activities and regenerate dashboard
        run: |
          python3 fetch_garmin_activities.py \
            --token-dir garmin_tokens \
            --start 2026-07-06 \
            --end 2026-10-26 \
            --out activities.json
          python3 generate_dashboard.py activities.json

      - name: Persist refreshed Garmin token
        # The garminconnect library auto-refreshes the DI token and rewrites
        # garmin_tokens/garmin_tokens.json on disk whenever it's close to
        # expiry -- but we were discarding that refreshed copy every run and
        # always re-feeding the same static, aging original from the secret.
        # That's what caused the token to go dead after ~4 days (2026-08-23)
        # even though the workflow itself was fine. Writing the (possibly
        # refreshed) token back to the secret after every successful run
        # lets it keep renewing itself indefinitely instead of aging out.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          gh secret set GARMIN_TOKEN_JSON \
            --repo "${{ github.repository }}" \
            --body "$(cat garmin_tokens/garmin_tokens.json)"

      - name: Clean up token files
        if: always()
        run: rm -rf garmin_tokens activities.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes to index.html, nothing to commit."
          else
            git add index.html
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
